<title>Путь банкира</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first app — sticky progress header, bottom tab bar; Program = list of months → month screen with numbered steps */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --fg:#11211B; --muted:#5B6E66; --line:#D8E2DD;
  --accent:#0E6B4E; --accent-soft:#E1F0EA; --on-accent:#FFFFFF; --gold:#8A6210; --gold-soft:#F6EDD8;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1411; --surface:#13201B; --fg:#E4EEE9; --muted:#93A69E; --line:#24352E;
  --accent:#4CC79A; --accent-soft:#163329; --on-accent:#0B1411; --gold:#D9AE55; --gold-soft:#2E2614; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1411; --surface:#13201B; --fg:#E4EEE9; --muted:#93A69E; --line:#24352E;
  --accent:#4CC79A; --accent-soft:#163329; --on-accent:#0B1411; --gold:#D9AE55; --gold-soft:#2E2614; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand h1{font-size:19px;font-weight:700}
.pct{font-family:var(--mono);font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

section.view{padding-block:18px 8px;display:grid;gap:14px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.card h3{font-size:15px}
p{margin:0}
.note{font-size:13px;color:var(--muted)}

/* Continue card */
.cont{display:grid;gap:12px;background:var(--accent);color:var(--on-accent);border-radius:18px;padding:18px;text-decoration:none}
.cont .lbl{color:inherit;opacity:.8}
.cont h2{font-size:19px;line-height:1.25}
.cont .go{justify-self:start;font-weight:700;font-size:14px;background:var(--on-accent);color:var(--accent);border-radius:999px;padding:8px 16px}

details.goal{background:var(--surface);border:1px solid var(--line);border-radius:16px}
details.goal summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.goal summary::-webkit-details-marker{display:none}
details.goal summary::after{content:"+";color:var(--muted);font-family:var(--mono)}
details.goal[open] summary::after{content:"−"}
.goalbody{padding:0 16px 16px;display:grid;gap:10px;font-size:14px}

.quarter{display:grid;gap:8px}
.quarter h2{font-size:14px;font-weight:600;font-family:var(--body);color:var(--muted)}
.quarter h2 b{font-family:var(--mono);color:var(--gold);font-weight:500;margin-right:6px}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--fg)}
.mrow.cur{border-color:var(--accent)}
.mnum{font-family:var(--mono);font-size:12px;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.mnum.done{background:var(--accent);color:var(--on-accent)}
.mrow .t{min-width:0;font-weight:600;font-size:14.5px;line-height:1.3}
.mrow .c{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Month screen */
.back{justify-self:start;text-decoration:none;font-weight:600;font-size:14px;padding:6px 0}
.mhead{display:grid;gap:6px}
.mhead h2{font-size:22px;line-height:1.2}
.simple{font-size:15px;background:var(--gold-soft);border-radius:14px;padding:14px}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.step{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.step input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
.step small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.step.exam{background:var(--gold-soft);border-color:transparent}
.step.exam small{color:var(--gold)}
.step:has(input:checked) span{opacity:.6}
.great{display:grid;gap:4px;padding-left:12px;border-left:3px solid var(--accent)}
.great b{font-size:14px}
.great span{font-size:14px}
.great em{font-style:normal;font-size:13px;color:var(--muted)}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.more summary{cursor:pointer;padding:13px 14px;font-weight:600;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";color:var(--muted);font-family:var(--mono)}
details.more[open] summary::after{content:"−"}
.morebody{padding:0 14px 14px;display:grid;gap:8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.links{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.links a{display:block;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:14px;font-weight:600}
.links a span{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.links li:last-child a{border-bottom:0}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pager a{text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--fg)}
.pager a small{display:block;color:var(--muted);font-size:11px}
.pager a.r{text-align:right;grid-column:2}

/* Lists */
.list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.list li{display:grid;gap:2px;font-size:14px}
.list li b{font-weight:600}
.list li span{color:var(--muted);font-size:13px}
.list li .take{color:var(--fg);font-size:13.5px}
.tag{font-family:var(--mono);font-size:11px;color:var(--accent)}
.tag.adv{color:var(--gold)}
.howto{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.howto li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14.5px}
.howto li::before{content:counter(s);font-family:var(--mono);font-size:13px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.cmds{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:14px;align-items:center}
.cmds code{font-family:var(--mono);font-size:13px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;justify-self:start}
.reset{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;cursor:pointer;justify-self:start;font-size:13px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs a{text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;display:grid;justify-items:center;gap:3px;padding:6px 2px;border-radius:10px}
nav.tabs a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>

let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { done = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch(e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const keysOf = n => [1,2,3,4].map(i=>`w${n}-${i}`).concat(`w${n}-x`);
const mDone = n => keysOf(n).filter(k=>done[k]).length;

function current(){
  for (const m of M){ const ks = keysOf(m.n);
    for (let i=0;i<ks.length;i++) if(!done[ks[i]]) return {m, i}; }
  return null;
}

function renderPlan(){
  const c = current();
  let h = c ? `<a class="cont" href="#m${c.m.n}">
      <p class="lbl">Продолжить · Месяц ${c.m.n} · ${c.i<4?"Неделя "+(c.i+1):"Контрольная"}</p>
      <h2>${esc(c.i<4?c.m.weeks[c.i]:c.m.title)}</h2>
      <span class="go">Открыть месяц</span></a>`
    : `<div class="cont"><p class="lbl">Готово</p><h2>Курс пройден</h2></div>`;
  h += `<details class="goal"><summary>Цель курса</summary><div class="goalbody">
      <p><b>Откуда:</b> с абсолютного нуля, объяснения как для 12-летнего.</p>
      <p><b>Куда:</b> финансы, рынки, все основные инструменты и термины, подходы великих финансистов. Управление финансами и финансовой корпорацией на уровне топ-менеджмента крупного банка.</p>
      <p><b>Срок:</b> 12 месяцев, 48 недель, 5 уроков в неделю.</p></div></details>`;
  Q.forEach((t, qi) => {
    h += `<div class="quarter"><h2><b>${QN[qi]}</b>${esc(t)}</h2>`;
    M.filter(m=>m.q===qi).forEach(m => {
      const d = mDone(m.n);
      h += `<a class="mrow${c&&c.m.n===m.n?" cur":""}" href="#m${m.n}"><span class="mnum${d===5?" done":""}">М${m.n}</span><span class="t">${esc(m.title)}</span><span class="c">${d}/5 ›</span></a>`;
    });
    h += `</div>`;
  });
  document.getElementById("v-plan").innerHTML = h;
}

function booksFor(n){
  const seen = new Set(), out = [];
  BOOKS.forEach(g => g.items.forEach(([a,t,ms,adv]) => {
    const k = a+t; if (ms.includes(n) && !seen.has(k)) { seen.add(k); out.push([a,t,adv]); }
  }));
  return out;
}

  const ml = ms => ms.map(x=>x===0?"весь год":"М"+x).join(", ");
  document.getElementById("v-books").innerHTML = `<p class="note">Метка месяца показывает, когда книга нужна. «Углублённо» — после базового учебника по теме.</p>` + BOOKS.map(g => `<div class="card"><h3>${esc(g.h)}</h3>
    <ul class="list">${g.items.map(([a,t,ms,adv])=>`<li><b>${esc(t)}</b><span>${esc(a)}</span><span class="tag">${ml(ms)}</span>${adv?'<span class="tag adv">углублённо</span>':""}</li>`).join("")}</ul></div>`).join("");
}

function renderMethod(){
  document.getElementById("v-method").innerHTML = `
  <div class="card"><h3>Как проходить урок</h3><ol class="howto">
    <li>Открой Claude Code в папке «Финансы» и напиши <b>урок</b>.</li>
    <li>Прочитай объяснение и реши задания. Ответы присылай и пиши <b>проверь</b>.</li>
    <li>Набрал от 7 из 10 — урок засчитан. Меньше — повторяем тему.</li>
    <li>Сдал 5 уроков недели — отметь неделю здесь, в «Программе».</li>
  </ol></div>
  <div class="card"><h3>Привычки великих</h3><ul class="list">
    ${HABITS.map(([w,h,who])=>`<li><b>${esc(h)}</b><span>${esc(w)} · ${esc(who)}</span></li>`).join("")}
  </ul></div>
  <div class="card"><h3>Что писать наставнику</h3><div class="cmds">
    <code>урок</code><span>следующий урок</span>
    <code>проверь</code><span>проверка ответов</span>
    <code>проще</code><span>объяснить по-другому</span>
    <code>глубже</code><span>как это видит топ-менеджер</span>
    <code>повтори</code><span>блиц из 10 вопросов</span>
    <code>контрольная</code><span>контрольная месяца</span>
    <code>где я</code><span>прогресс и что дальше</span>
  </div></div>
  <div class="card"><h3>Каждую неделю</h3><p>Одно письмо акционерам (Berkshire, Nomad, Fundsmith, Даймон, Айкан, Pershing Square) и обзоры «Антонов такой Антонов» и «Кримсон Дайджест».</p></div>
  <div class="card"><h3>Отметки</h3><p class="note">Хранятся только в этом браузере на этом телефоне.</p>
    <button class="reset" id="reset" type="button">Сбросить все отметки</button>
    <p class="note" id="resetnote" hidden>Нажми ещё раз, чтобы сбросить.</p></div>`;
}

function updateHeader(){
  let cnt = 0; M.forEach(m => cnt += mDone(m.n));
  document.getElementById("pct").textContent = cnt + " / 60";
  document.getElementById("barfill").style.width = (cnt/60*100) + "%";
}

document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  if (e.target.checked) done[k] = 1; else delete done[k];
  save(); updateHeader();
  const n = +k.slice(1).split("-")[0];
  const lbl = document.querySelector("#v-month .mhead .lbl");
  if (lbl) lbl.textContent = `Квартал ${QN[M[n-1].q]} · Месяц ${n} · ${mDone(n)}/5`;
});
let armed = false;
document.addEventListener("click", e => {
  if (e.target.id !== "reset") return;
  const nEl = document.getElementById("resetnote");
  if (!armed) { armed = true; nEl.hidden = false; setTimeout(()=>{armed=false; nEl.hidden=true;}, 4000); return; }
  done = {}; save(); updateHeader(); armed = false; nEl.hidden = true;
});

const VIEWS = ["plan","method","names","books"];
function route(){
  const h = location.hash.slice(1);
  const mm = /^m(\d{1,2})$/.exec(h);
  let v = VIEWS.includes(h) ? h : "plan";
  document.querySelectorAll("section.view").forEach(s => s.hidden = true);
  if (mm && +mm[1] >= 1 && +mm[1] <= 12) { renderMonth(+mm[1]); document.getElementById("v-month").hidden = false; v = "plan"; }
  else { if (v === "plan") renderPlan(); document.getElementById("v-"+v).hidden = false; }
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.v === v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0,0);
}
renderNames(); renderBooks(); renderMethod(); updateHeader();
window.addEventListener("hashchange", route);
route();
</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
