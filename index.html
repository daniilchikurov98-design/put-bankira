<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Путь банкира">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Путь банкира</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first app — sticky progress header, bottom tab bar; Program = list of months → month screen with numbered steps */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --fg:#11211B; --muted:#5B6E66; --line:#D8E2DD;
  --accent:#0E6B4E; --accent-soft:#E1F0EA; --on-accent:#FFFFFF; --gold:#8A6210; --gold-soft:#F6EDD8;
  --bad:#B42318; --bad-soft:#FDECEA;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1411; --surface:#13201B; --fg:#E4EEE9; --muted:#93A69E; --line:#24352E;
  --accent:#4CC79A; --accent-soft:#163329; --on-accent:#0B1411; --gold:#D9AE55; --gold-soft:#2E2614;
  --bad:#F97066; --bad-soft:#3A1B19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1411; --surface:#13201B; --fg:#E4EEE9; --muted:#93A69E; --line:#24352E;
  --accent:#4CC79A; --accent-soft:#163329; --on-accent:#0B1411; --gold:#D9AE55; --gold-soft:#2E2614;
  --bad:#F97066; --bad-soft:#3A1B19; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand h1{font-size:19px;font-weight:700}
.pct{font-family:var(--mono);font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

section.view{padding-block:18px 8px;display:grid;gap:14px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.card h3{font-size:15px}
p{margin:0}
.note{font-size:13px;color:var(--muted)}

/* Continue card */
.cont{display:grid;gap:12px;background:var(--accent);color:var(--on-accent);border-radius:18px;padding:18px;text-decoration:none}
.cont .lbl{color:inherit;opacity:.8}
.cont h2{font-size:19px;line-height:1.25}
.cont .go{justify-self:start;font-weight:700;font-size:14px;background:var(--on-accent);color:var(--accent);border-radius:999px;padding:8px 16px}

details.goal{background:var(--surface);border:1px solid var(--line);border-radius:16px}
details.goal summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.goal summary::-webkit-details-marker{display:none}
details.goal summary::after{content:"+";color:var(--muted);font-family:var(--mono)}
details.goal[open] summary::after{content:"−"}
.goalbody{padding:0 16px 16px;display:grid;gap:10px;font-size:14px}

.quarter{display:grid;gap:8px}
.quarter h2{font-size:14px;font-weight:600;font-family:var(--body);color:var(--muted)}
.quarter h2 b{font-family:var(--mono);color:var(--gold);font-weight:500;margin-right:6px}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--fg)}
.mrow.cur{border-color:var(--accent)}
.mnum{font-family:var(--mono);font-size:12px;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.mnum.done{background:var(--accent);color:var(--on-accent)}
.mrow .t{min-width:0;font-weight:600;font-size:14.5px;line-height:1.3}
.mrow .c{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Month screen */
.back{justify-self:start;text-decoration:none;font-weight:600;font-size:14px;padding:6px 0}
.mhead{display:grid;gap:6px}
.mhead h2{font-size:22px;line-height:1.2}
.simple{font-size:15px;background:var(--gold-soft);border-radius:14px;padding:14px}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.step{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.step input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
.step small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.step.exam{background:var(--gold-soft);border-color:transparent}
.step.exam small{color:var(--gold)}
.step:has(input:checked) span{opacity:.6}
.great{display:grid;gap:4px;padding-left:12px;border-left:3px solid var(--accent)}
.great b{font-size:14px}
.great span{font-size:14px}
.great em{font-style:normal;font-size:13px;color:var(--muted)}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.more summary{cursor:pointer;padding:13px 14px;font-weight:600;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";color:var(--muted);font-family:var(--mono)}
details.more[open] summary::after{content:"−"}
.morebody{padding:0 14px 14px;display:grid;gap:8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.links{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.links a{display:block;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:14px;font-weight:600}
.links a span{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.links li:last-child a{border-bottom:0}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pager a{text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--fg)}
.pager a small{display:block;color:var(--muted);font-size:11px}
.pager a.r{text-align:right;grid-column:2}

/* Lists */
.list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.list li{display:grid;gap:2px;font-size:14px}
.list li b{font-weight:600}
.list li span{color:var(--muted);font-size:13px}
.list li .take{color:var(--fg);font-size:13.5px}
.tag{font-family:var(--mono);font-size:11px;color:var(--accent)}
.tag.adv{color:var(--gold)}
.howto{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.howto li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14.5px}
.howto li::before{content:counter(s);font-family:var(--mono);font-size:13px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.cmds{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:14px;align-items:center}
.cmds code{font-family:var(--mono);font-size:13px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;justify-self:start}
.reset{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;cursor:pointer;justify-self:start;font-size:13px}

/* Profiles */
details.pf summary{list-style:none;cursor:pointer;display:grid;gap:2px}
details.pf summary::-webkit-details-marker{display:none}
.more-l{font-size:12.5px;color:var(--accent);font-weight:600}
details.pf[open] .more-l{display:none}
.pfb{display:grid;gap:8px;margin-top:10px;padding:12px;background:var(--bg);border-radius:12px;font-size:14px}
.ev{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13.5px;list-style:disc}
.list .ev li{display:list-item;font-size:13.5px}
blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 8px 8px 0;font-size:14px}
.yr{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.ltb{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--gold);background:var(--gold-soft);padding:1px 6px;border-radius:999px;vertical-align:2px}
.ltcard{border-color:var(--gold)}
.ips{background:var(--gold-soft);border-radius:16px;padding:16px;display:grid;gap:8px}
.ips .lbl{color:var(--gold)}

/* Lessons inside month */
.wkblock{display:grid;gap:6px}
.lessons{display:grid;gap:6px;padding-left:14px}
.lrow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;text-decoration:none;color:var(--fg);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:14px}
.lrow .st{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-family:var(--mono)}
.lrow.ok .st{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lrow .sc{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.soon{font-size:13px;color:var(--muted);padding-left:14px}

/* Lesson screen */
.lsec p+p{margin-top:8px}
.fx{font-family:var(--mono);font-size:13.5px;background:var(--bg);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
.qz{display:grid;gap:0}
.q{display:grid;gap:8px;padding-block:14px;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:4px}
.q > b{font-weight:600;font-size:14.5px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px}
.opt input{margin:3px 0 0;accent-color:var(--accent);width:18px;height:18px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.num{display:flex;gap:8px;align-items:center}
.num input{flex:1;min-width:0;font:inherit;font-family:var(--mono);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.num span{color:var(--muted);font-size:14px}
.fb{font-size:13.5px;padding:9px 11px;border-radius:9px}
.fb.ok{background:var(--accent-soft)}
.fb.no{background:var(--bad-soft)}
.fb b{font-weight:700}
.fb.ok b{color:var(--accent)}
.fb.no b{color:var(--bad)}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;justify-self:start}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.score{font-family:var(--display);font-size:17px}
.score.ok{color:var(--accent)}
.score.no{color:var(--bad)}
textarea.ans{width:100%;min-height:130px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);resize:vertical}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs a{text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;display:grid;justify-items:center;gap:3px;padding:6px 2px;border-radius:10px}
nav.tabs a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Путь банкира</h1><span class="pct" id="pct">0 / 60</span></div>
    <div class="bar"><i id="barfill"></i></div>
  </header>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-month" hidden></section>
  <section class="view" id="v-lesson" hidden></section>
  <section class="view" id="v-names" hidden></section>
  <section class="view" id="v-books" hidden></section>
  <section class="view" id="v-method" hidden></section>
</div>

<nav class="tabs" aria-label="Разделы">
  <a href="#plan" data-v="plan"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Программа</a>

  <a href="#names" data-v="names"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Великие</a>
  <a href="#books" data-v="books"><svg viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>Книги</a>
</nav>

<script>
const LESSONS = {};
</script>
<script>
/* Профили великих: y — годы, bio — кто это, ev — ключевые события, q — цитаты, lt — учитель для долгосрочного инвестора */
var PROFILES = {
"Дж. П. Морган":{y:"1837–1913",bio:"Самый влиятельный банкир США на рубеже XIX–XX веков. Реорганизовывал разорившиеся железные дороги и собирал из конкурентов гигантов: General Electric, U.S. Steel.",
 ev:["1895 — спас казначейство США от нехватки золота, организовав заём","1901 — создал U.S. Steel, первую компанию стоимостью больше $1 млрд","1907 — запер банкиров в своей библиотеке, пока они не договорились спасти рынок; после паники создали ФРС"],
 q:["«Первое — это характер», — ответ Конгрессу в 1912 году на вопрос, на чём основан кредит."]},
"Майер Амшель Ротшильд":{y:"1744–1812",bio:"Основатель банковской династии из франкфуртского гетто. Отправил пятерых сыновей во Франкфурт, Лондон, Париж, Вену и Неаполь и построил первую международную банковскую сеть.",
 ev:["Собственная курьерская сеть доставляла новости быстрее правительств","Финансирование Британии в наполеоновских войнах","XIX век — кредиты государствам и железным дорогам Европы"],
 q:["«Покупай, когда на улицах льётся кровь» — фразу приписывают одному из Ротшильдов; документальных подтверждений нет."]},
"Уоррен Баффет":{y:"род. 1930",lt:1,bio:"Самый известный инвестор в истории. Ученик Грэма, превратил текстильную фабрику Berkshire Hathaway в конгломерат стоимостью около триллиона долларов. Ежегодные письма акционерам — бесплатный университет инвестиций.",
 ev:["В 11 лет купил первые акции, к 30 годам стал миллионером","1965 — получил контроль над Berkshire Hathaway","1988 — начал покупать Coca-Cola и держит её до сих пор","2008 — во время кризиса вложил $5 млрд в Goldman Sachs на выгодных условиях","В мае 2025 объявил, что с 2026 года генеральным директором станет Грег Абел"],
 q:["«Правило № 1: никогда не теряй деньги. Правило № 2: никогда не забывай правило № 1».","«Будь жадным, когда другие боятся, и боязливым, когда другие жадны».","«Наш любимый срок владения — навсегда»."]},
"Джейми Даймон":{y:"род. 1956",bio:"Председатель и CEO JPMorgan Chase с 2005–2006 годов, крупнейшего банка США. Считается лучшим управляющим банком своего поколения: банк прошёл кризис 2008 года с прибылью.",
 ev:["1998 — уволен из Citigroup Сэнди Уэйллом, своим наставником; потом возглавил Bank One","2008 — купил Bear Stearns и Washington Mutual в разгар кризиса","2012 — «Лондонский кит»: убыток около $6 млрд на трейдинге; публично признал ошибку","2023 — купил рухнувший First Republic"],
 q:["Его принцип — «крепостной баланс» (fortress balance sheet): капитал и ликвидность с большим запасом, чтобы пережить любую бурю."]},
"Амадео Джаннини":{y:"1870–1949",bio:"Сын итальянских иммигрантов, основал в Сан-Франциско Bank of Italy для простых людей, которых не обслуживали большие банки. Банк стал Bank of America.",
 ev:["1904 — открыл банк для рабочих и иммигрантов","1906 — после землетрясения вывез деньги в телеге с апельсинами и выдавал кредиты на восстановление со стола на пристани","Первым построил большую сеть отделений","Финансировал молодой Голливуд, в том числе первый полнометражный мультфильм Диснея"],
 q:[]},
"Джордж Сорос":{y:"род. 1930",bio:"Родился в Будапеште, пережил нацистскую оккупацию, учился в Лондонской школе экономики у философа Карла Поппера. Основал Quantum Fund — один из самых успешных хедж-фондов в истории.",
 ev:["1973 — вместе с Джимом Роджерсом основал фонд, позже Quantum","1992 — «Чёрная среда»: сыграл против фунта и заработал около $1 млрд за день; Британия вышла из европейского валютного механизма","Теория рефлексивности: ожидания участников меняют саму реальность рынка"],
 q:["«Важно не то, прав ты или нет, а сколько зарабатываешь, когда прав, и сколько теряешь, когда неправ»."]},
"Джим Саймонс":{y:"1938–2024",bio:"Математик мирового уровня и бывший криптограф АНБ. Основал Renaissance Technologies и доказал, что рынок можно обыгрывать математикой и данными.",
 ev:["1976 — премия Веблена по геометрии; теория Черна — Саймонса используется в физике","1978–1982 — основал Renaissance","Фонд Medallion с 1988 по 2018 год приносил в среднем около 66% годовых до комиссий","Нанимал учёных, а не выпускников Уолл-стрит"],

const toNum = s => { const v = parseFloat(String(s).replace(/[\s ]/g,"").replace(",",".").replace(/[^0-9.\-]/g,"")); return isNaN(v) ? null : v; };
const fmt = x => Number(x).toLocaleString("ru-RU");

function checkQuiz(){
  const id = document.getElementById("v-lesson").dataset.id, L = LESSONS[id];
  let score = 0;
  L.quiz.forEach((q,i) => {
    let ok, given = true;
    if (q.o) { const sel = document.querySelector(`input[name="q${i}"]:checked`); given = !!sel; ok = sel && +sel.value === q.a; }
    else { const v = toNum(document.getElementById(`q${i}n`).value); given = v !== null; ok = v !== null && Math.abs(v - q.n) <= (q.t||0) + 1e-9; }
    if (ok) score++;
    const fb = document.getElementById("fb"+i);
    fb.hidden = false; fb.className = "fb " + (ok ? "ok" : "no");
    const right = q.o ? q.o[q.a] : fmt(q.n) + (q.u ? " " + q.u : "");
    fb.innerHTML = ok ? `<b>✓ Верно.</b> ${esc(q.e)}` : `<b>✗ ${given?"Неверно":"Нет ответа"}.</b> Правильно: ${esc(right)}. ${esc(q.e)}`;
  });
  const total = L.quiz.length, prev = LS.res[id];
  LS.res[id] = {best: Math.max(score, prev ? prev.best : 0), total, last: score};
  saveL();
  const pass = score / total >= 0.7;
  const res = document.getElementById("qres");
  res.hidden = false; res.className = "score " + (pass ? "ok" : "no");
  res.textContent = `${score} из ${total} — ${pass ? "зачёт! Отправь открытый ответ наставнику." : "пока не зачёт. Перечитай урок и попробуй снова."}`;
  document.getElementById("qreset").hidden = false;
  const [n,w] = id.split("-").map(Number), ids = lessonIds(n,w);
  if (ids.length === 5 && ids.every(passed)) { done[`w${n}-${w}`] = 1; save(); updateHeader(); }
  res.scrollIntoView({block:"center", behavior:"smooth"});
}

  document.getElementById("v-names").innerHTML =
    `<div class="card ltcard"><h3>Твои главные учителя</h3>
      <p>Твоя стратегия — долгосрочные консервативные инвестиции: покупать и держать, мало операций. Ближе всего к ней подход этих людей, их изучай особенно внимательно:</p>
      <div class="chips">${lt.map(n=>`<span>${esc(n)}</span>`).join("")}</div>
      <p class="note">Остальных изучаем, чтобы понимать рынки, банки и риск. Учиться у трейдера — не значит торговать.</p></div>
    <p class="note">Нажми на имя: биография, ключевые события и цитаты.</p>` +
    NAMES.map(g => `<div class="card"><h3>${esc(g.h)}</h3>
    ${g.note?`<p class="note">${esc(g.note)}</p>`:""}
    <ul class="list">${g.items.map(person).join("")}</ul></div>`).join("");
}

function renderBooks(){
  const ml = ms => ms.map(x=>x===0?"весь год":"М"+x).join(", ");
  document.getElementById("v-books").innerHTML = `<p class="note">Метка месяца показывает, когда книга нужна. «Углублённо» — после базового учебника по теме.</p>` + BOOKS.map(g => `<div class="card"><h3>${esc(g.h)}</h3>
    <ul class="list">${g.items.map(([a,t,ms,adv])=>`<li><b>${esc(t)}</b><span>${esc(a)}</span><span class="tag">${ml(ms)}</span>${adv?'<span class="tag adv">углублённо</span>':""}</li>`).join("")}</ul></div>`).join("");
}

function renderMethod(){
  document.getElementById("v-method").innerHTML = `
  <div class="card"><h3>Как проходить урок</h3><ol class="howto">
    <li>Открой Claude Code в папке «Финансы» и напиши <b>урок</b>.</li>
    <li>Прочитай объяснение и реши задания. Ответы присылай и пиши <b>проверь</b>.</li>
    <li>Набрал от 7 из 10 — урок засчитан. Меньше — повторяем тему.</li>
    <li>Сдал 5 уроков недели — отметь неделю здесь, в «Программе».</li>
  </ol></div>
  <div class="card"><h3>Привычки великих</h3><ul class="list">
    ${HABITS.map(([w,h,who])=>`<li><b>${esc(h)}</b><span>${esc(w)} · ${esc(who)}</span></li>`).join("")}
  </ul></div>
  <div class="card"><h3>Что писать наставнику</h3><div class="cmds">
    <code>урок</code><span>следующий урок</span>
    <code>проверь</code><span>проверка ответов</span>
    <code>проще</code><span>объяснить по-другому</span>
    <code>глубже</code><span>как это видит топ-менеджер</span>
    <code>повтори</code><span>блиц из 10 вопросов</span>
    <code>контрольная</code><span>контрольная месяца</span>
    <code>где я</code><span>прогресс и что дальше</span>
  </div></div>
  <div class="card"><h3>Каждую неделю</h3><p>Одно письмо акционерам (Berkshire, Nomad, Fundsmith, Даймон, Айкан, Pershing Square) и обзоры «Антонов такой Антонов» и «Кримсон Дайджест».</p></div>
  <div class="card"><h3>Отметки</h3><p class="note">Хранятся только в этом браузере на этом телефоне.</p>
    <button class="reset" id="reset" type="button">Сбросить все отметки</button>
    <p class="note" id="resetnote" hidden>Нажми ещё раз, чтобы сбросить.</p></div>`;
}

function updateHeader(){
  let cnt = 0; M.forEach(m => cnt += mDone(m.n));
  document.getElementById("pct").textContent = cnt + " / 60";
  document.getElementById("barfill").style.width = (cnt/60*100) + "%";
}

document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  if (e.target.checked) done[k] = 1; else delete done[k];
  save(); updateHeader();
  const n = +k.slice(1).split("-")[0];
  const lbl = document.querySelector("#v-month .mhead .lbl");
  if (lbl) lbl.textContent = `Квартал ${QN[M[n-1].q]} · Месяц ${n} · ${mDone(n)}/5`;
});
document.addEventListener("input", e => {
  if (e.target.classList && e.target.classList.contains("ans")) { LS.ans[e.target.id.slice(4)] = e.target.value; saveL(); }
});
document.addEventListener("click", e => {
  const t = e.target;
  if (t.id === "qcheck") checkQuiz();
  if (t.id === "qreset") { renderLesson(document.getElementById("v-lesson").dataset.id); window.scrollTo(0,0); }
  if (t.id === "qcopy") {
    const id = document.getElementById("v-lesson").dataset.id, L = LESSONS[id], r = LS.res[id];
    const txt = `Урок ${id} «${L.title}»\nТест: ${r ? r.best + " из " + r.total : "не пройден"}\nВопрос: ${L.open}\nМой ответ: ${LS.ans[id] || ""}`;
    const note = document.getElementById("copynote");
    const fallback = () => { const ta = document.getElementById("ans-"+id); ta.value = txt; ta.focus(); ta.select(); note.textContent = "Скопировать автоматически не вышло: текст выделен, скопируй его вручную. Твой ответ сохранён."; };
    try { navigator.clipboard.writeText(txt).then(()=>{ note.textContent = "Скопировано. Вставь в чат с наставником."; }, fallback); } catch(err) { fallback(); }
  }
});
let armed = false;
document.addEventListener("click", e => {
  if (e.target.id !== "reset") return;
  const nEl = document.getElementById("resetnote");
  if (!armed) { armed = true; nEl.hidden = false; setTimeout(()=>{armed=false; nEl.hidden=true;}, 4000); return; }
  done = {}; save(); updateHeader(); armed = false; nEl.hidden = true;
});

const VIEWS = ["plan","method","names","books"];
function route(){
  const h = location.hash.slice(1);
  const mm = /^m(\d{1,2})$/.exec(h);
  const lm = /^l(\d{1,2}-\d-\d)$/.exec(h);
  let v = VIEWS.includes(h) ? h : "plan";
  document.querySelectorAll("section.view").forEach(s => s.hidden = true);
  if (lm && LESSONS[lm[1]]) { renderLesson(lm[1]); document.getElementById("v-lesson").hidden = false; v = "plan"; }
  else if (mm && +mm[1] >= 1 && +mm[1] <= 12) { renderMonth(+mm[1]); document.getElementById("v-month").hidden = false; v = "plan"; }
  else { if (v === "plan") renderPlan(); document.getElementById("v-"+v).hidden = false; }
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.v === v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0,0);
}
renderNames(); renderBooks(); renderMethod(); updateHeader();
window.addEventListener("hashchange", route);
route();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
